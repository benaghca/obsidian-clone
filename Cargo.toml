[package]
name = "cinder"
version = "0.1.0"
edition = "2024"

[dependencies]
notify = "8"
serde_json = "1.0.151"
tao = "0.37.0"
tiny_http = "0.12.0"
wry = { version = "0.57.0", features = ["linux-body"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
strip = true
