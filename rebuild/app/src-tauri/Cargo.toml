[package]
name = "grove"
version = "0.1.0"
description = "Local Markdown notes in the Obsidian vault format"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "grove_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
# Already compiled in through tauri-utils; named directly for its Unicode
# letter and digit classes (index/tags.rs), which std does not have.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Already in the build through wry (Tauri's Linux webview); named directly only
# to switch on WebKitGTK's own spellchecker (Enchant with on-disk dictionaries,
# nothing networked), which wry leaves off, and to read
# `is_main_frame_main_resource` (WebKit 2.40) so a registered embed origin cannot
# navigate the main frame. `v2_40` is a cfg of this crate, not a new dependency.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
# Already in the build through tauri and tao (the type of `WebviewWindow::gtk_window`); named
# directly so the opt-in frame pacing (src/frame_pacing.rs) can hook the window's draw and
# frame clock. Same 0.18 line as Cargo.lock, so no new crate.
gtk = "0.18"

[dev-dependencies]
# Empty feature of the tauri crate already in the build. It only exposes
# `tauri::test` (MockRuntime) so the headless smoke can invoke commands
# without a WebKit window. No extra crates.
tauri = { version = "2", features = ["test"] }

[features]
# `tauri build` turns this on so the webview embeds ../dist.
# A plain `cargo build` leaves it off and loads devUrl instead, so the
# frontend does not have to be built first.
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package."*"]
opt-level = 2
